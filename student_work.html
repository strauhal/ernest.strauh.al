	<style>
		
    #about p {
    	text-align: left;
    }

    #contact p {
    	text-align: right;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      grid-auto-rows: 250px; /* Lock the height so single and double pages align perfectly */
      grid-auto-flow: dense; /* Automatically fills in any blank holes left by wide images */
      gap: 15px;
      padding: 20px;
    }
    #grid img {
      width: 75%;
      height: 75%;
      object-fit: contain; /* Keeps your sketches from getting chopped up */
      cursor: pointer;
    }
    /* This class is handed out by our script to any wide image */
    #grid img.wide-spread {
      grid-column: span 2;
    }

    #slideshow {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #ffffff;
      z-index: 100;
      cursor: alias;
      overflow-x: auto; /* Lets the wide tracks scroll horizontally */
      overflow-y: hidden;
      text-align: center; /* Centers the standard single pages */
      white-space: nowrap;
    }
    #slideshow.active {
      display: block; /* Removed flexbox so wide spreads can scroll naturally */
    }

    #stage-container {
      position: relative;
      display: inline-block;
      height: 95vh; /* Locks the height so every page feels uniform */
      margin-top: 2.5vh; /* Centers the stage vertically */
      cursor: default; 
    }
    #stage-container img {
      display: block;
      height: 100%;
      width: auto; /* Lets the double-spread expand as wide as it needs */
      max-width: none; /* Removes the width limit */
      object-fit: contain;
    }

    .nav-zone {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
    }
    
    #zone-left {
      left: 0;
      cursor: w-resize; /* Built-in West (Left) arrow */
    }
    
    #zone-right {
      right: 0;
      cursor: e-resize; /* Built-in East (Right) arrow */
    }

    @media (max-width: 768px) {
      /* 1. Shrink grid for phones so it's a tight 2-column layout */
      #grid {
        grid-template-columns: repeat(2, 1fr);
        padding: 10px;
        gap: 10px;
        align-items: center;
      }
      /* 2. Disable horizontal scroll on mobile, swipe/tap feels better */
      #slideshow {
        overflow: hidden; 
      }
      /* 3. Force the stage to exactly fit the phone screen's dimensions */
      #stage-container {
        width: 100vw;
        height: 100vh;
        margin-top: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* 4. Keep the whole image visible on the screen without scrolling */
      #stage-container img {
        width: 100%;
        height: 100%;
        max-width: 100%;
        object-fit: contain;
      }
    }


	</style>

    let currentIndex = 0;
    
    const gridEl = document.getElementById('grid');
    const slideshowEl = document.getElementById('slideshow');
    const currentSlideEl = document.getElementById('current-slide');
    const zoneLeftEl = document.getElementById('zone-left');
    const zoneRightEl = document.getElementById('zone-right');
    const stageContainerEl = document.getElementById('stage-container');

    // ==========================================
    // 2. BUILD THE GRID
    // ==========================================
    images.forEach((src, index) => {
      const img = document.createElement('img');
      img.src = src;
      
      // Check the dimensions once the image loads to see if it's a wide spread
      img.onload = () => {
        // If the width is at least 1.2x bigger than the height, it's a spread
        if (img.naturalWidth > img.naturalHeight * 1.2) {
          img.classList.add('wide-spread');
        }
      };

      // Plug the thumbnail directly into the openSlideshow function
      img.addEventListener('click', () => openSlideshow(index));
      gridEl.appendChild(img);
    });

    // ==========================================
    // 3. SLIDESHOW CONTROLS (The Backstage Crew)
    // ==========================================
    
    function openSlideshow(index) {
      currentIndex = index;
      updateSlideImage();
      slideshowEl.classList.add('active'); // Fade in the stage
    }

    function closeSlideshow() {
      slideshowEl.classList.remove('active'); // Fade out the stage
    }

    function changeSlide(direction) {
      currentIndex = currentIndex + direction;
      
      // Loop back to the beginning if we go past the end
      if (currentIndex >= images.length) {
        currentIndex = 0;
      }
      // Skip to the end if we go backwards past the first image
      if (currentIndex < 0) {
        currentIndex = images.length - 1;
      }
      
      updateSlideImage();
    }

    function updateSlideImage() {
      currentSlideEl.src = images[currentIndex];
    }

    // ==========================================
    // 4. WIRING UP THE CABLES (Mouse Events)
    // ==========================================
    
    // Clicking the dark void closes the show
    slideshowEl.addEventListener('click', closeSlideshow);
    
    // Prevent clicks on the image itself from closing the show
    stageContainerEl.addEventListener('click', (event) => {
      event.stopPropagation(); 
    });

    // Click left zone to go backward
    zoneLeftEl.addEventListener('click', (event) => {
      event.stopPropagation(); // Keep the show open
      changeSlide(-1);
    });

    // Click right zone to go forward
    zoneRightEl.addEventListener('click', (event) => {
      event.stopPropagation(); // Keep the show open
      changeSlide(1);
    });

    // ==========================================
    // 5. MIDI CONTROLLER (Keyboard Events)
    // ==========================================
    
    document.addEventListener('keydown', (event) => {
      // Only listen for keys if the slideshow is actually open
      if (slideshowEl.classList.contains('active')) {
        if (event.key === 'ArrowLeft') {
          changeSlide(-1);
        } else if (event.key === 'ArrowRight') {
          changeSlide(1);
        } else if (event.key === 'Escape') {
          closeSlideshow(); // Bonus feature: Esc key ends the show
        }
      }
    });
